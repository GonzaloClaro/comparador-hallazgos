# Los 38 puntos del checklist de aprobación de informes de auditoría.
# Es configuración (como el catálogo de empresas): editar acá NO cambia el schema.
#
# Enunciados (2026-10-16): texto literal del ítem de la planilla oficial
# "CheckList Revisión" del CEN (hoja "Check List", columna de chequeo), igual en
# los 6 checklists de informes_reales/. El código de ítem de cada punto está en
# mapeo_checklist_gt.yaml. Solo se normalizaron espacios; las erratas del
# original ("SE calcula", "el el") se conservan para no alterar el texto.
# Los puntos 3, 4 y 5 desglosan el ítem 1.4 (la viñeta con código, fecha y
# versión): cada uno usa las palabras del 1.4 acotadas a su elemento.
# La numeración 1-38 y los donde_buscar base vienen de "checklist_general/"
# (2026-07-07). El txt «dónde buscar» termina en el 33: los base de 34 a 38 los
# redactamos a partir de las ubicaciones del ejemplo de «salida esperada».
#
# Criterios confirmados por el equipo revisor el 2026-07-16, respondiendo
# tasks/equipo/respuestas_v1.md:
# - Regla general OFICIAL: el checklist evalúa AL INFORME, no a la instalación.
#   Deficiencia levantada explícitamente como hallazgo = el punto CUMPLE.
#   (En julio fue un ✓ sobre un texto nuestro; el equipo revisor la dio con sus
#   palabras el 2026-10-17, ver abajo.)
# - Hints de los puntos 6, 9, 16, 25, 26 y 37 ajustados con sus palabras. Los de
#   17 y 18 no: se apoyan en un ✓ sobre una opción que redactamos nosotros (el 18,
#   además, en una respuesta a una descripción equivocada del punto), que no es un
#   criterio firme (tasks/lessons.md, 2026-10-17).
# - 2026-10-17 (tasks/equipo/respuestas_v3_celdas.md, transmitido por el usuario):
#   el equipo revisor RETIRA la excepción de resultado del punto 23 que había confirmado el
#   2026-07-16; la regla general no tiene excepciones (despeje > 400 ms levantado
#   como hallazgo = cumple).
#
# Ajustes nuestros del 2026-10-17, sin confirmar por el equipo revisor: hint 6
# precisado (el DUF debe venir dentro del PDF: un unilineal simplificado, los
# diagramas del modelo de coordinación o la remisión a una carpeta aparte no
# bastan), por la decisión del usuario sobre Gamma 6 (pendiente en la P1 de la
# v3); hint 20: ya no dice que el 23 exige el resultado (coherencia con el retiro).
#
# Los enunciados oficiales a veces piden más que el criterio: el prompt indica que
# el "criterio" de cada punto (donde_buscar) manda cuando precisa o relaja el
# enunciado. Qué puntos relajan el enunciado, y si alguien lo decidió, está en el
# bloque `origen` de cada punto (relaja_enunciado e historia).
#
# Hints de los puntos 14, 17, 18, 20, 22, 26, 27, 29, 35 y 36 ajustados el 2026-10-16 con
# el criterio inferido de los 6 checklists revisados por humanos (verificado
# contra los informes), sin contradecir las reglas del equipo revisor.
#
# Bloque `origen` de cada punto (M66): queda fuera del prompt (user_checklist no lo
# lee) y cargar_puntos lo valida (etapa0_checklist.OrigenCriterio).
# - relaja_enunciado: el criterio pide menos que el enunciado oficial.
# - preguntas: preguntas abiertas al equipo revisor que afectan el criterio
#   (tasks/equipo/preguntas_v3.md; P4b: relajaciones que nadie decidió).
# - historia, en orden cronológico. fecha: cuándo se fijó el criterio (no la del
#   commit); commit: cuándo entró a git ("" si nunca entró). tipo:
#   literal_equipo (palabras del equipo revisor), aprobado_sobre_texto_nuestro (✓
#   del equipo revisor sobre un texto nuestro), inferido_planillas (deducido de las
#   planillas revisadas por humanos), propuesto (redacción o convención nuestra) o
#   base_checklist_general.
# - confirmado: true solo con literal_equipo y una respuesta escrita en
#   tasks/equipo/respuestas_*.md; un ✓ sobre un texto nuestro nunca lo es (lección del
#   2026-10-17). Lo de respuestas_v3_celdas.md lo transmitió el usuario el 2026-10-17.
# - Sin citas de fuentes privadas (planillas, checklist_general/, mediciones/).

